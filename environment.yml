# UNVERIFIED on every machine until story M1-01. If pip resolution fails, use scripts/setup_env.sh.
name: kairos
channels:
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - --extra-index-url https://pypi.org/simple
      - -f https://data.pyg.org/whl/torch-1.13.0+cpu.html
      - torch==1.13.1
      - torchvision==0.14.1
      - torchaudio==0.13.1
      - torch-scatter==2.1.1
      - torch-sparse==0.6.17
      - torch-cluster==1.6.1
      - torch-spline-conv==1.2.2
      - torch-geometric==2.0.0
      - numpy<2
      - scikit-learn==1.2.0
      - scipy==1.11.1
      - networkx==2.8.7
      - pandas==2.0.3
      - matplotlib
      - tqdm
      - psutil
      - pytest
      - -e .
