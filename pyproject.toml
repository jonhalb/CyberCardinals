[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-repro"
version = "0.1.0"
description = "Team Cyber Cardinals: from-scratch reproduction of KAIROS (IEEE S&P 2024) on StreamSpot"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
